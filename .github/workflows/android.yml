name: Android

on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Host build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build python3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch SDL2, OpenAL Soft, GCEM
        run: sh android/fetch-deps.sh

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: android-cxx-${{ hashFiles('android/fetch-deps.sh', 'cmake/Android.cmake') }}-${{ github.sha }}
          restore-keys: android-cxx-${{ hashFiles('android/fetch-deps.sh', 'cmake/Android.cmake') }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: uzdoom-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
