name: Android

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  # Publishing a release (tag like v0.0.1) on GitHub builds the APK and attaches it.
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write   # needed to publish releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Host build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build python3

      # The runner image ships the Android SDK; just add what this build needs.
      - name: Install NDK, CMake and SDK platform
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch SDL2, OpenAL Soft, GCEM
        run: sh android/fetch-deps.sh

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: android-cxx-${{ hashFiles('android/fetch-deps.sh', 'cmake/Android.cmake') }}-${{ github.sha }}
          restore-keys: android-cxx-${{ hashFiles('android/fetch-deps.sh', 'cmake/Android.cmake') }}-

      # Permanent release key, stored as two repository secrets:
      #   ANDROID_KEYSTORE_BASE64    the PKCS#12 keystore, base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD  its password
      # Without them, test builds use the debug key; releases refuse to build.
      - name: Set up release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "UZDOOM_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "::error::Release builds need the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets"
            exit 1
          else
            echo "::warning::No release key secrets; signing with a temporary debug key"
          fi

      - name: Build release APK
        working-directory: android
        env:
          UZDOOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Check APK signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          # "Signer #1 certificate SHA-256 digest: …" or "V2 Signer: certificate SHA-256 digest: …"
          DIGEST=$(grep -m1 'certificate SHA-256 digest:' signature.txt | awk '{print $NF}')
          EXPECTED=$(tr -d ' \n' < android/signing-cert-sha256.txt)
          if [ -z "$DIGEST" ]; then echo "::error::Could not read the APK signing certificate"; exit 1; fi
          echo "Signing certificate SHA-256: $DIGEST"
          if [ "${{ github.event_name }}" = "release" ] && [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the release key ($EXPECTED)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Check APK contents
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -E 'lib/|assets/engine/[^/]*$|assets/licenses/' | tee apk-contents.txt
          for f in lib/arm64-v8a/libmain.so lib/arm64-v8a/libSDL2.so lib/arm64-v8a/libopenal.so \
                   lib/arm64-v8a/libc++_shared.so lib/arm64-v8a/libsndfile.so lib/arm64-v8a/libmpg123.so \
                   assets/engine/uzdoom.pk3 \
                   assets/licenses/uzdoom/gpl.txt assets/licenses/sdl2.txt assets/licenses/openal-soft.txt \
                   assets/licenses/gcem.txt assets/licenses/content-game-support.md \
                   assets/licenses/libsndfile.txt assets/licenses/mpg123.txt assets/licenses/libflac.txt; do
            grep -q " $f\$" apk-contents.txt || { echo "::error::missing $f in APK"; exit 1; }
          done

      - name: Check tag matches versionName
        if: github.event_name == 'release'
        run: |
          VERSION=$(sed -n "s/^ *versionName '\(.*\)'/\1/p" android/app/build.gradle)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in android/app/build.gradle"
            exit 1
          fi

      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          OUT="UZDoomDroid-$TAG.apk"
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          NOTES="android/release-notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          CERT=$(tr -d ' \n' < android/signing-cert-sha256.txt)
          { cat "$NOTES"; printf '\n\n**APK SHA-256:** `%s`\n\n**Signing certificate SHA-256:** `%s`\n' "$(cut -d' ' -f1 "$OUT.sha256")" "$CERT"; } > notes.md
          gh release upload "$TAG" "$OUT" "$OUT.sha256" --clobber
          gh release edit "$TAG" --title "UZDoomDroid $TAG" --notes-file notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: uzdoomdroid-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
