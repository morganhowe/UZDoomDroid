import com.android.build.api.variant.ApplicationVariant

plugins {
    id 'com.android.application'
}

// Layout:
//   <repo>/CMakeLists.txt         the engine (built with the NDK)
//   <repo>/android/deps           SDL2 + OpenAL Soft sources (fetch-deps.sh)
//   <repo>/android/hosttools      lemon/re2c/zipdir, built for the build machine
def repoRoot      = rootProject.file('..')
def depsDir       = rootProject.file('deps')
def hostToolsDir  = layout.buildDirectory.dir('hosttools').get().asFile
def engineDataDir = layout.buildDirectory.dir('engine-data').get().asFile
def abiList       = (project.findProperty('uzdoom.abis') ?: 'arm64-v8a').split(',').collect { it.trim() }

// Release signing key. CI decodes it from the repository secrets (see
// .github/workflows/android.yml). Without it, release builds fall back to the
// debug key, which is fine for testing but can't update an installed release.
def releaseKeystore = System.getenv('UZDOOM_KEYSTORE')

android {
    namespace 'io.github.morganhowe.uzdoomdroid'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.morganhowe.uzdoomdroid'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.0.3'

        ndk {
            abiFilters(*abiList)
        }

        externalNativeBuild {
            cmake {
                arguments "-DUZDOOM_ANDROID_DEPS=${depsDir}",
                          "-DIMPORT_EXECUTABLES=${hostToolsDir}/ImportExecutables.cmake",
                          "-DUZDOOM_ENGINE_DATA_DIR=${engineDataDir}",
                          '-DANDROID_STL=c++_shared',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "${repoRoot}/CMakeLists.txt"
            version '3.22.1'
            buildStagingDirectory file('.cxx')
        }
    }

    sourceSets {
        main {
            // SDL's Java glue must match the native SDL version, so use it straight from the SDL checkout.
            java.srcDirs += "${depsDir}/SDL/android-project/app/src/main/java"
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('UZDOOM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UZDOOM_KEY_ALIAS') ?: 'uzdoomdroid'
                keyPassword System.getenv('UZDOOM_KEY_PASSWORD') ?: System.getenv('UZDOOM_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    androidResources {
        noCompress 'pk3', 'sf2', 'wopl', 'wopn'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ---------------------------------------------------------------------------
// Third-party sources
// ---------------------------------------------------------------------------
def fetchDeps = tasks.register('fetchDeps', Exec) {
    description = 'Clones SDL2 and OpenAL Soft into android/deps'
    commandLine 'sh', rootProject.file('fetch-deps.sh').absolutePath
    onlyIf { ['SDL/CMakeLists.txt', 'openal-soft/CMakeLists.txt', 'libsndfile/CMakeLists.txt',
              'mpg123/ports/cmake/CMakeLists.txt', 'gcem/include/gcem.hpp'].any { !new File(depsDir, it).exists() } }
}

// ---------------------------------------------------------------------------
// Code generators (lemon, re2c, zipdir) must run on the build machine.
// ---------------------------------------------------------------------------
def configureHostTools = tasks.register('configureHostTools', Exec) {
    inputs.file rootProject.file('hosttools/CMakeLists.txt')
    outputs.file new File(hostToolsDir, 'ImportExecutables.cmake')
    commandLine 'cmake', '-S', rootProject.file('hosttools').absolutePath, '-B', hostToolsDir.absolutePath,
                '-DCMAKE_BUILD_TYPE=Release'
}
def buildHostTools = tasks.register('buildHostTools', Exec) {
    dependsOn configureHostTools
    commandLine 'cmake', '--build', hostToolsDir.absolutePath, '--config', 'Release', '--parallel'
}

tasks.named('preBuild').configure { dependsOn fetchDeps, buildHostTools }
tasks.configureEach { t ->
    if (t.name.startsWith('configureCMake') || t.name.startsWith('buildCMake')) {
        t.dependsOn fetchDeps, buildHostTools
    }
}

// ---------------------------------------------------------------------------
// Engine data (pk3s, soundfonts, FM banks) produced by the native build is
// shipped as APK assets under engine/ and extracted on first launch.
// ---------------------------------------------------------------------------
abstract class CollectEngineData extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getSourceDir()

    // License texts shown on the launcher's "Licenses" screen.
    @Internal
    abstract DirectoryProperty getRepoRoot()

    @Internal
    abstract DirectoryProperty getDepsDir()

    @InputFiles
    abstract ConfigurableFileCollection getLicenseInputs()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void collect() {
        def src = sourceDir.get().asFile
        def dst = new File(outputDir.get().asFile, 'engine')
        project.delete(dst)
        project.copy {
            from(src) {
                include '*.pk3'
                include 'soundfonts/**'
                include 'fm_banks/**'
                exclude '**/*.txt'
            }
            into dst
        }
        copyLicenses(new File(outputDir.get().asFile, 'licenses'))

        def pk3s = dst.listFiles()?.findAll { it.name.endsWith('.pk3') } ?: []
        if (!pk3s.any { it.name == 'uzdoom.pk3' }) {
            throw new GradleException("uzdoom.pk3 was not produced by the native build (looked in ${src})")
        }
    }

    private void copyLicenses(File dst) {
        def root = repoRoot.get().asFile
        def deps = depsDir.get().asFile
        project.delete(dst)
        // UZDoom and its bundled components
        project.copy { from(new File(root, 'docs/licenses')); into new File(dst, 'uzdoom') }
        project.copy { from(new File(root, 'LICENSE')); into dst; rename { 'uzdoom-license.txt' } }
        project.copy { from(new File(root, 'branding/BRANDING-LICENSE.md')); into dst; rename { 'uzdoom-branding.md' } }
        // Game-content pk3s (free to share, not for sale)
        project.copy { from(new File(root, 'wadsrc_bm/static/license.md')); into dst; rename { 'content-brightmaps.md' } }
        project.copy { from(new File(root, 'wadsrc_extra/nonfree/license.md')); into dst; rename { 'content-game-support.md' } }
        project.copy { from(new File(root, 'wadsrc_widepix/static/license.md')); into dst; rename { 'content-widepix.md' } }
        project.copy { from(new File(root, 'fm_banks')) { include '*.txt' }; into new File(dst, 'fm_banks') }
        // Libraries fetched by fetch-deps.sh
        project.copy { from(new File(deps, 'SDL/LICENSE.txt')); into dst; rename { 'sdl2.txt' } }
        project.copy { from(new File(deps, 'openal-soft/COPYING')); into dst; rename { 'openal-soft.txt' } }
        project.copy { from(new File(deps, 'openal-soft/LICENSE-pffft')); into dst; rename { 'openal-soft-pffft.txt' } }
        project.copy { from(new File(deps, 'gcem/LICENSE')); into dst; rename { 'gcem.txt' } }
        project.copy { from(new File(deps, 'libsndfile/COPYING')); into dst; rename { 'libsndfile.txt' } }
        project.copy { from(new File(deps, 'mpg123/COPYING')); into dst; rename { 'mpg123.txt' } }
        project.copy { from(new File(deps, 'ogg/COPYING')); into dst; rename { 'libogg.txt' } }
        project.copy { from(new File(deps, 'vorbis/COPYING')); into dst; rename { 'libvorbis.txt' } }
        project.copy { from(new File(deps, 'flac/COPYING.Xiph')); into dst; rename { 'libflac.txt' } }
        project.copy { from(new File(deps, 'opus/COPYING')); into dst; rename { 'opus.txt' } }
        ['uzdoom-license.txt', 'sdl2.txt', 'openal-soft.txt', 'gcem.txt', 'content-game-support.md',
         'libsndfile.txt', 'mpg123.txt', 'libogg.txt', 'libvorbis.txt', 'libflac.txt', 'opus.txt'].each {
            if (!new File(dst, it).isFile()) throw new GradleException("License file ${it} is missing")
        }
    }
}

androidComponents {
    onVariants(selector().all()) { ApplicationVariant variant ->
        def cap = variant.name.capitalize()
        def collect = tasks.register("collectEngineData${cap}", CollectEngineData) { t ->
            t.dependsOn "externalNativeBuild${cap}"
            t.sourceDir.set(new File(engineDataDir, abiList[0]))
            t.repoRoot.set(repoRoot)
            t.depsDir.set(depsDir)
            t.licenseInputs.from(new File(repoRoot, 'docs/licenses'), new File(repoRoot, 'LICENSE'),
                               new File(depsDir, 'SDL/LICENSE.txt'), new File(depsDir, 'openal-soft/COPYING'),
                               new File(depsDir, 'gcem/LICENSE'), new File(depsDir, 'libsndfile/COPYING'),
                               new File(depsDir, 'mpg123/COPYING'), new File(depsDir, 'ogg/COPYING'),
                               new File(depsDir, 'vorbis/COPYING'), new File(depsDir, 'flac/COPYING.Xiph'),
                               new File(depsDir, 'opus/COPYING'))
        }
        variant.sources.assets?.addGeneratedSourceDirectory(collect, { it.outputDir })
    }
}
